<script id="v22-clean-bonus">
try{ const r=localStorage.getItem('azbuka_xp'); if(r==='0'||r==='"0"') localStorage.setItem('azbuka_xp', JSON.stringify({xp:0,streak:0,qCount:0,learned:[]})); }catch{}
function hideDelete(){ document.querySelectorAll('button').forEach(b=>{ if((b.textContent||'').trim()==='RANGLISTE LÖSCHEN'){ b.style.display='none'; b.remove(); } }); }
setInterval(hideDelete, 500);

const bonusCSS = `
  .azbuka-bonus{position:fixed;z-index:9999;font-weight:900;font-size:20px;padding:0;background:none !important;border:none !important;box-shadow:none !important;color:white;pointer-events:none;white-space:nowrap;animation:azbuka-bonus-float 1.2s ease-out forwards;filter: drop-shadow(0 2px 6px rgba(0,0,0,0.9)) drop-shadow(0 0 2px rgba(0,0,0,0.8));}
  @keyframes azbuka-bonus-float{0%{transform:translateY(0) scale(0.6);opacity:0;}15%{transform:translateY(-10px) scale(1.2);opacity:1;}60%{transform:translateY(-50px) scale(1);opacity:1;}100%{transform:translateY(-90px) scale(0.8);opacity:0;}}
  .bonus-answer{color:#D4FF00;text-shadow:0 0 8px rgba(212,255,0,0.6),0 2px 4px rgba(0,0,0,0.9);}
  .bonus-streak{color:#FF8C42;text-shadow:0 0 8px rgba(255,140,66,0.7),0 2px 4px rgba(0,0,0,0.9);}
  .bonus-level{color:#B388FF;text-shadow:0 0 8px rgba(179,136,255,0.7),0 2px 4px rgba(0,0,0,0.9);}
  .bonus-level-high{color:#FFD700;font-size:22px;text-shadow:0 0 10px rgba(255,215,0,0.8),0 2px 6px rgba(0,0,0,0.9);}
`;
const se=document.createElement('style'); se.textContent=bonusCSS; document.head.appendChild(se);
let activeBonuses=[];
function getNonOverlappingPositions(count){
  const positions=[]; const W=160,H=30; const minX=16,maxX=Math.max(minX,window.innerWidth-W-16); const minY=90,maxY=Math.max(minY,window.innerHeight-160);
  const forbidden={x1:window.innerWidth*0.15,x2:window.innerWidth*0.85,y1:window.innerHeight*0.42,y2:window.innerHeight*0.88};
  let attempts=0;
  while(positions.length<count && attempts<150){ attempts++; const x=minX+Math.random()*(maxX-minX); const y=minY+Math.random()*(maxY-minY); if(x>=forbidden.x1&&x<=forbidden.x2&&y>=forbidden.y1&&y<=forbidden.y2) continue; const cx=x+W/2,cy=y+H/2; if(cx>=forbidden.x1&&cx<=forbidden.x2&&cy>=forbidden.y1&&cy<=forbidden.y2) continue; let overlap=false; for(const p of positions){ if(Math.abs(x-p.x)<W+20&&Math.abs(y-p.y)<H+20){overlap=true;break;}} if(!overlap){ for(const p of activeBonuses){ if(Math.abs(x-p.x)<W+20&&Math.abs(y-p.y)<H+20){overlap=true;break;}}} if(!overlap) positions.push({x,y,w:W,h:H}); }
  while(positions.length<count){ const idx=positions.length; if(idx===0) positions.push({x:minX+10,y:minY+10,w:W,h:H}); else if(idx===1) positions.push({x:maxX-10,y:minY+20,w:W,h:H}); else if(idx===2) positions.push({x:minX+20,y:maxY-30,w:W,h:H}); else positions.push({x:minX+Math.random()*(maxX-minX),y:minY+Math.random()*80,w:W,h:H}); }
  return positions;
}
function showBonusesTogether(bonuses){
  if(!bonuses.length) return;
  const positions=getNonOverlappingPositions(bonuses.length);
  bonuses.forEach((b,i)=>{ const pos=positions[i]; const el=document.createElement('div'); el.className=b.high?`azbuka-bonus bonus-level-high`:`azbuka-bonus bonus-${b.type}`; el.textContent=b.text; el.style.left=pos.x+'px'; el.style.top=pos.y+'px'; document.body.appendChild(el); activeBonuses.push(pos); setTimeout(()=>{ el.remove(); activeBonuses=activeBonuses.filter(p=>p!==pos); },1200); });
}
function getStreakBonusPercent(s){ if(s<3) return 0; if(s<=4) return 0.10; if(s<=6) return 0.20; if(s<=9) return 0.35; if(s<=14) return 0.50; if(s<=19) return 0.75; if(s<=24) return 1.00; return 1.25; }
function getLevelMultiplier(level){ if(level<8) return 1; if(level===8) return 1.3; if(level===9) return 1.5; if(level===10) return 1.7; if(level===11) return 2.0; if(level===12) return 2.3; if(level===13) return 2.6; if(level===14) return 3.0; if(level===15) return 3.4; if(level===16) return 3.8; if(level===17) return 4.2; if(level===18) return 4.6; if(level===19) return 5.0; if(level===20) return 5.5; if(level===21) return 6.0; if(level===22) return 6.5; if(level===23) return 7.0; if(level===24) return 7.5; if(level===25) return 8.0; if(level===26) return 8.5; if(level===27) return 9.0; if(level===28) return 9.5; if(level===29) return 10.0; if(level>=30) return 10.5; return 1; }
function getLevelFromXP(xp){ const th=[0,100,250,450,700,1000,1400,1900,2500,3200,4000,5000,6200,7600,9200,11200,12800,14600,16600,18800,21200,23800,26600,29600,32800,36200,39800,43600,47600,51800,56200,60800,65600,70600,75800,81200]; let lvl=1; for(let i=0;i<th.length;i++){ if(xp>=th[i]) lvl=i+1; else break; } return lvl; }
function getDifficultyBase(d){ if(d==='easy') return 10; if(d==='medium') return 20; return 35; }
function getCurrentDifficulty(){ try{ const raw=localStorage.getItem('azbuka_xp'); if(raw){ const dd=JSON.parse(raw); const learned=dd.learned?.length||0; if(learned<=11) return 'easy'; if(learned<=21) return 'medium'; return 'hard'; } }catch{} return 'easy'; }
(function(){
  let lastXP=0; try{ const raw=localStorage.getItem('azbuka_xp'); if(raw){ const d=JSON.parse(raw); lastXP=d.xp||0; } }catch{}
  setInterval(()=>{
    try{
      const raw=localStorage.getItem('azbuka_xp'); if(!raw) return; const data=JSON.parse(raw); if(typeof data.xp!=='number') return;
      if(data.xp>lastXP){ const gained=data.xp-lastXP; if(gained>0&&gained<150){
          const diff=getCurrentDifficulty(); const base=getDifficultyBase(diff); const level=getLevelFromXP(data.xp); const levelMult=getLevelMultiplier(level); const streak=data.streak||0;
          const streakPercent=getStreakBonusPercent(streak); const streakBonus=Math.floor(base*streakPercent); const levelBonus=Math.floor(base*(levelMult-1));
          const bonuses=[]; bonuses.push({text:`+${base} XP`, type:'answer'});
          if(streakPercent>0){ const streakText=streak<=6?`🔥 +${streakBonus} x${streak}`:streak<=14?`🔥🔥 +${streakBonus} x${streak}`:`🔥🔥🔥 +${streakBonus} x${streak}`; bonuses.push({text:streakText, type:'streak'}); }
          if(levelMult>1){ const lvlText = level>=26 ? `👑 +${levelBonus} Lvl ${level}` : level>=20 ? `💎 +${levelBonus} Lvl ${level}` : `⭐ +${levelBonus} Lvl ${level}`; bonuses.push({text:lvlText, type:'level', high: level>=26}); }
          let extra=0; if(streakPercent>0) extra+=streakBonus; if(levelMult>1) extra+=levelBonus;
          if(gained===base && extra>0){ data.xp+=extra; localStorage.setItem('azbuka_xp', JSON.stringify(data)); }
          showBonusesTogether(bonuses);
        } lastXP=data.xp;
      } else if(data.xp<lastXP){ lastXP=data.xp; }
    }catch(e){}
  },500);
})();
</script>
